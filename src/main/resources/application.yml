spring:
  application:
    name: elibrary-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:h2:mem:elibrary;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

app:
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never

